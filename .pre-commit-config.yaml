repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Temporarily disabled for initial commit - will re-enable after cleanup
  # - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
  #   rev: 2.7.3
  #   hooks:
  #     - id: editorconfig-checker
  #       alias: ec

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix --unsafe-fixes --exit-zero
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
