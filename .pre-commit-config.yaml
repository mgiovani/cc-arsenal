repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 2.7.3
    hooks:
      - id: editorconfig-checker
        alias: ec
        exclude: \.(md)$

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix --unsafe-fixes
        language: system
        types: [python]
        exclude: ^examples/
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        exclude: ^examples/
        require_serial: true
      - id: gen-skill-docs
        name: gen-skill-docs
        entry: uv run python -m scripts.gen_skill_docs --check
        language: system
        pass_filenames: false
        files: ^(skills/.*/SKILL\.md|skills\.sh\.json|README\.md|AGENTS\.md|CONTRIBUTING\.md|docs/(features|getting-started|onboarding)\.md|\.claude-plugin/.*\.json)$
