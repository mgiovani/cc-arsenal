[project]
name = "cc-arsenal"
version = "0.1.0"
description = "Professional utility scripts for Claude Code"
authors = [
    { name = "CC Arsenal Team", email = "contact@mgiovani.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.8",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
claude-install = "scripts.setup.install:main"
claude-configure = "scripts.setup.configure:main"
claude-generate = "scripts.generators.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
target-version = "py312"
exclude = ["alembic", "examples/"]
line-length = 90
indent-width = 4
show-fixes = true

[tool.ruff.format]
line-ending = "lf"
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
extend-select = [
    # PEP-8 and Flake8
    "A", # builtins
    "ANN", # annotations
    "ARG", # unused arguments
    "ASYNC", # flake8-async
    "BLE", # blind-except
    "C4", # comprehensions
    "DTZ", # datetime timezone
    "FBT", # boolean-trap
    "G", # flake8-logging-format
    "I", # isort
    "INP", # implicit-namespace-package
    "ISC", # implicit-str-concat
    "N", # naming
    "PIE", # flake8-pie
    "PT", # flake8-pytest
    "PTH", # flake8-pathlib
    "PYI", # flake-8pyi
    "RET", # flake8-return
    "RSE", # flake8-raise
    "RUF", # ruff
    "S", # bandit
    "SIM", # flake8-simplify
    "SLF", # flake8-self
    "T10", # debugger
    "T20", # prints
    "TCH", # flake8-type-checking
    "TID", # tidy imports

    # Bugs and errors
    "B", # bugbear
    "E", # pycodestyle errors
    "F", # pyflakes
    "PL", # pylint

    # Other
    "C90", # mccabe complexity
    "ERA", # commented out code
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "BLE001", # Do not catch blind exception: `Exception`
    "C901", # Function is too complex
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "FBT001", # Boolean-typed positional argument in function definition
    "PLC0415", # `import` should be at the top-level of a file
    "S607", # Starting a process with a partial executable path
    "G004", # Logging statement uses f-string
    "E501", # Line too long (for complex cases)
    "SIM102", # Use a single `if` statement
    "ARG002", # Unused method argument
    "DTZ005", # datetime.now() without timezone
    "PTH123", # open() should be Path.open()
    "B007", # Loop control variable not used
    "S603", # subprocess call: check for execution of untrusted input
    "S110", # try-except-pass detected
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101"]  # Allow asserts in test files

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src", "app"]
case-sensitive = true
combine-as-imports = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.pycodestyle]
max-line-length = 90

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-dummy-args = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--strict-markers",
]
