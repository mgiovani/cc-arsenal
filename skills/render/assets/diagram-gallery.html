      { from: 'integrate', to: 'docs' },
      { from: 'integrate', to: 'verify' },

  // every hard case (a cycle, a self-loop, a 5-way fan-out AND a 3-way
  // fan-in) into one graph simultaneously, both budget caps at once. That
  // combination isn't a realistic dependency graph, it's a stress test,
  // and no layered router keeps a small graph that dense under the
  // R6 crossing budget. This keeps every feature the blurb promises
  // (cycle, self-loop, fan-out, a long edge, labels) at a size a reader
  // could actually untangle by eye.
  push('core', 'dependency', 'A cycle, a self-loop, a fan-out, a long edge and labels in one small graph.', {
    anchor: 'diagram-render-kit-draft-state',
    title: 'page.js and localStorage read each other’s draft; sweep() re-schedules itself; init() fans out to its setup steps.',

})();

<script>
const GROUPS = [
  ['core', 'Core'],
  ['structure', 'Structure'],
  ['flow', 'Flow and behavior'],
  ['planning', 'Planning'],
  ['data', 'Analysis and data'],
  ['hierarchy', 'Hierarchy and compare'],
  ['strategy', 'Flow and strategy'],
];

function emptyGroup(id) {
  return `<div class="empty"><p class="title">No examples yet</p><p class="text">The ${Render.esc(id)} group hasn’t landed.</p></div>`;
}

function renderExample(ex) {
  const builder = window.Render.diagram[ex.type];
  if (!builder) return `<div class="empty"><p class="title">Unknown type: ${Render.esc(ex.type)}</p></div>`;
  return `<p class="meta">${Render.esc(ex.blurb)}</p>${builder(ex.spec)}`;
}

function mount() {
  const examples = window.DG_EXAMPLES || [];
  const toc = GROUPS.map(([id, label]) => `<li><a href="#group-${id}">${Render.esc(label)}</a></li>`).join('');
  const sections = GROUPS.map(([id, label]) => {
    const items = examples.filter((ex) => ex.group === id);
    const body = items.length ? items.map(renderExample).join('') : emptyGroup(id);
    return `<section class="section" id="group-${id}" data-section="${Render.esc(label)}"><h2>${Render.esc(label)}</h2>${body}</section>`;
  }).join('');

  document.getElementById('root').innerHTML = `
    <nav class="toc" aria-label="On this page">
      <h2>On this page</h2>
      <ol>${toc}</ol>
    </nav>

    <header class="page-head">
      <h1>Render diagram gallery</h1>
      <p class="meta">Every <span class="mono">Render.diagram.&lt;type&gt;</span> builder, drawn once with real
      content from this repository. One example on this page is a deliberate refusal
      (over the node budget) so you can see what "not drawn" looks like.</p>
    </header>

    ${sections}
  `;
}

mount();
if (window.Render) {
  Render.init({ verdicts: null, file: 'diagram-gallery-render-2026-09-24.html', title: 'Render diagram gallery' });
}
</script>
