const DATA = /*SAMPLE*/{

function pips(score, max) {
  return Array.from({ length: max }, (_, i) => `<i${i < score ? ' class="on"' : ''}></i>`).join('');
}

function scoreCell(cell) {
  return `<span class="score"><span class="pips" aria-label="${cell.score} of ${cell.max}">${pips(cell.score, cell.max)}</span>${cell.score}</span><span class="text">${Render.esc(cell.text)}</span>`;
}

function anchoredCell(tag, anchor, label, cls, html) {
  const classes = ['anchored', cls].filter(Boolean).join(' ');
  return `<${tag} class="${classes}" data-anchor="${Render.esc(anchor)}" data-label="${Render.esc(label)}">`
    + `<button class="mark" type="button" aria-label="Comment on ${Render.esc(label)}">+</button>`
    + `<div class="body">${html}</div></${tag}>`;
}

function renderQuestion(data) {
  return `<section class="section" id="question" data-section="The question">
    <h2>The question</h2>
    <p class="tldr">${Render.esc(data.question)}</p>
  </section>`;
}

function renderMatrix(data) {
  if (!data.criteria.length || !data.options.length) {
    return `<section class="section" id="matrix" data-section="Matrix">
      <h2>Matrix</h2>
      <div class="empty"><p class="title">No options or criteria yet</p><p class="text">Add at least three options and one criterion to build the comparison.</p></div>
    </section>`;
  }
  // Column headers stay plain th (not anchored): the option's own anchor
  // lives once, on its block in the Options section below, so a comment
  // never has to choose between two DOM homes for the same identity.
  const head = data.options.map((o) => {
    const pick = `<button type="button" class="btn pick" data-page-key="winner" data-page-value="option-${Render.esc(o.slug)}" aria-pressed="false">Pick</button>`;
    return `<th${o.win ? ' class="win"' : ''}>${Render.esc(o.label)}<br>${pick}</th>`;
  }).join('');
  const rows = data.criteria.map((c) => {
    const th = anchoredCell('th', `criterion-${c.slug}`, c.label, '', `${Render.esc(c.label)}<span class="meta">weight ${c.weight}</span>`);
    const cells = data.options.map((o) => {
      const cell = o.cells[c.slug];
      const label = `${o.label} / ${c.label}`;
      return anchoredCell('td', `cell-${o.slug}-${c.slug}`, label, o.win ? 'win' : '', scoreCell(cell));
    }).join('');
    return `<tr>${th}${cells}</tr>`;
  }).join('');
  return `<section class="section" id="matrix" data-section="Matrix">
    <div class="section-head"><h2>Matrix</h2><span class="meta">${data.options.length} options, ${data.criteria.length} criteria</span></div>
    <div class="table-scroll">
      <table class="matrix">
        <thead><tr><th>Criterion</th>${head}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </section>`;
}

function renderOption(o) {
  const head = `<div class="head"><h3 class="title">${Render.esc(o.label)}</h3>`
    + `<button type="button" class="btn pick" data-page-key="winner" data-page-value="option-${Render.esc(o.slug)}" aria-pressed="false">Pick</button>`
    + `${o.win ? '<span class="tag">Recommended</span>' : ''}</div>`;
  const strengths = `<div class="side before"><h4 class="side-h">Strengths</h4><ul>${o.strengths.map((s) => `<li>${Render.esc(s)}</li>`).join('')}</ul></div>`;
  const costs = `<div class="side after"><h4 class="side-h">Costs</h4><ul>${o.costs.map((s) => `<li>${Render.esc(s)}</li>`).join('')}</ul></div>`;
  return Render.anchored({
    anchor: `option-${o.slug}`,
    label: o.label,
    cls: 'option',
    html: `${head}<div class="split">${strengths}${costs}</div>`,
  });
}

function renderOptions(data) {
  if (!data.options.length) {
    return `<section class="section" id="options" data-section="Options">
      <h2>Options</h2>
      <div class="empty"><p class="title">No options yet</p><p class="text">Each option needs a strengths and costs summary once it is added to the matrix.</p></div>
    </section>`;
  }
  return `<section class="section" id="options" data-section="Options">
    <div class="section-head"><h2>Options</h2><span class="meta">${data.options.length}</span></div>
    <div class="list">${data.options.map(renderOption).join('')}</div>
  </section>`;
}

function renderDecision(data) {
  const body = data.decision
    ? `<aside class="callout" data-kind="decision"><span class="callout-label">Decision</span><p>${Render.esc(data.decision)}</p></aside>`
    : `<div class="empty"><p class="title">No decision recorded</p><p class="text">State a winner and the reasoning once the matrix above settles.</p></div>`;
  return `<section class="section" id="decision" data-section="Decision"><h2>Decision</h2>${body}</section>`;
}

function renderSources(data) {
  if (!data.sources.length) {
    return `<section class="section" id="sources" data-section="Sources">
      <h2>Sources</h2>
      <div class="empty"><p class="title">No sources cited</p><p class="text">Every scored cell above needs a source behind it; list them here.</p></div>
    </section>`;
  }
  const items = data.sources.map((s) => (
    `<li><cite class="source"><a href="${Render.esc(s.href)}">${Render.esc(s.label)}</a></cite><p class="text">${Render.esc(s.claim)}</p></li>`
  )).join('');
  return `<section class="section" id="sources" data-section="Sources">
    <div class="section-head"><h2>Sources</h2><span class="meta">${data.sources.length}</span></div>
    <ul class="stack">${items}</ul>
  </section>`;
}

function mount(data) {
  const root = document.getElementById('root');
  root.innerHTML = `<header class="page-head">
      <h1>${Render.esc(data.title)}</h1>
      <p class="meta">${Render.esc(data.byline)}</p>
    </header>`
    + renderQuestion(data)
    + renderMatrix(data)
    + renderOptions(data)
    + renderDecision(data)
    + renderSources(data);
}

mount(DATA);
if (window.Render) {
  Render.init({ verdicts: null, file: 'compare-install-cc-arsenal-skills-2026-09-23.html', title: DATA.title });
}
</script>
