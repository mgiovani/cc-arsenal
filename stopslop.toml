# stopslop config. Run: `make slop`.

# Skill templates ship placeholders (`[DESCRIBE]`, `<!-- fill in -->`) on purpose.
# The Code of Conduct is the verbatim Contributor Covenant: third-party text.
# Test fixtures are deliberately crude input for the parsers under test.
exclude = ["**/assets/templates/**", "docs/CODE_OF_CONDUCT.md", "scripts/tests/fixtures/**"]
